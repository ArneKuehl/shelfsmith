# cleaning-rules.yaml
# Maschinell lesbare Bereinigungsregeln für E-Book-Dateinamen
# Abgeleitet aus 1278 manuellen Dirty→Clean-Mappings in duplicates.json
#
# Anwendungsreihenfolge: Abschnitte sind in der Reihenfolge angegeben,
# in der sie auf den Dateinamen-Stem (ohne Extension) angewendet werden sollen.

# ---------------------------------------------------------------------------
# 0. DATEIENDUNG
# ---------------------------------------------------------------------------
# Vor allen Operationen: Extension abtrennen und separat merken.
# Erkannte Extensions:
extensions:
  - .epub
  - .pdf
  - .mobi
  - .azw3

# ---------------------------------------------------------------------------
# 1. UNICODE-NORMALISIERUNG
# ---------------------------------------------------------------------------
unicode:
  normalization: NFC
  # Decomposed characters (z.B. u + combining diaeresis) → precomposed (ü)

# ---------------------------------------------------------------------------
# 2. QUELL-MARKIERUNGEN (Suffix-Entfernung + optionales Tagging)
# ---------------------------------------------------------------------------
# Reihenfolge: längste/spezifischste Muster zuerst anwenden.
source_suffixes:

  - id: annas_archive
    description: Anna's Archive Download-Signatur
    # Beispiel: "Title -- Author -- 2024 -- Publisher -- a1b2c3d4 -- Anna's Archive"
    regex: '\s*--\s*.+?\s*--\s*\d{4}\s*--\s*.+?\s*--\s*[a-f0-9]{16,}\s*--\s*Anna.?s Archive\s*$'
    action: remove
    tag: null

  - id: libgen
    description: Library Genesis Suffix
    # Beispiel: "Author - Title-Publisher (2021) - libgen.li"
    regex: '\s*-\s*libgen\.li\s*$'
    action: remove
    tag: null

  - id: royalroad_rylrdl
    description: Royal Road Plattform-ID
    # Beispiel: "Title-rylrdl_60127"  oder  "Title-rylrdl_66279"
    regex: '-?rylrdl[_-]?\d+\s*$'
    action: remove
    tag: royalroad   # → clean name bekommt Suffix " - (Royalroad)"

  - id: zlibrary
    description: Z-Library Marker in Klammern
    # Beispiel: "Title (Z-Library)"
    regex: '\s*\(Z-Library\)\s*$'
    action: remove
    tag: null

  - id: numeric_id
    description: Numerische Download-ID (6+ Ziffern) nach Unterstrich
    # Beispiel: "The Battlemage_116967466"  |  "Title_122991047"
    regex: '[_-]\d{6,}\s*$'
    action: remove
    tag: null

# ---------------------------------------------------------------------------
# 3. DATEINAMEN-INTERNE MARKER (Entfernung)
# ---------------------------------------------------------------------------
inline_markers:

  - id: epub_marker
    description: "(epub)" als Dateinamen-Bestandteil
    # Beispiel: "Author - Title (epub).epub"
    regex: '\s*\(epub\)\s*'
    action: remove

  - id: download_duplicate_number
    description: Nummerierter Download-Duplikat-Suffix "(1)", "(2)" etc.
    # Beispiel: "filename(1).epub"  |  "filename (2).pdf"
    regex: '\s*\(\d{1,2}\)\s*$'
    action: remove

  - id: final_marker
    description: "(Final)" Vorschau-/Vorabversions-Markierung
    regex: '\s*\(Final\)\s*'
    action: remove

  - id: version_marker
    description: Versionsnummern wie "(v5.0)", "(MEAP V06)"
    regex: '\s*\((?:v\d[\d.]*|MEAP\s+V\d+)\)\s*'
    action: remove

  - id: auth_marker
    description: '(auth.) Markierung'
    regex: '\s*\(auth\.\)\s*'
    action: remove

  - id: author_marker
    description: '(Author) Markierung'
    regex: '\s*\(Author\)\s*'
    action: remove

  - id: us_marker
    description: "(US) Ländermarkierung"
    regex: '\s*\(US\)\s*'
    action: remove

  - id: german_edition_marker
    description: "(German Edition)"
    regex: '\s*\(German Edition\)\s*'
    action: remove

  - id: essentials_marker
    description: "(essentials)" Reihen-Tag von Springer
    regex: '\s*\(essentials\)\s*'
    action: remove

  - id: dummies_prefix
    description: "(Dummies)" oder "(Rich Dad)" als Klammer-Prefix
    # Beispiel: "(Dummies) Author - Title"  |  "(Rich Dad) Author - Title"
    regex: '^\([A-Za-z ]+\)\s+'
    action: remove

  - id: leading_bracket_number
    description: "[0]" Nummerierungs-Prefix
    # Beispiel: "[0] Hans Rosling - Factfulness"
    regex: '^\[0\]\s+'
    action: remove

  - id: terra_astra_prefix
    description: "TA NNN -" Prefix der Terra Astra Heft-Reihe
    # Beispiel: "TA 241 - Blish, James - Star Trek 10 - Spocks Gehirn"
    regex: '^TA\s+\d+\s*-\s*'
    action: remove

# ---------------------------------------------------------------------------
# 4. VERLAGS- UND JAHRES-BLOCK (Suffix-Entfernung)
# ---------------------------------------------------------------------------
# Muster: "-Verlagsname (JJJJ)" oder "-Verlagsname (JJJJ, Stadt)"
# Nur entfernen wenn die Klammer eine vierstellige Jahreszahl enthält.
